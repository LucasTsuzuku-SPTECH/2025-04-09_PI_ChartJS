<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chart JS</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <h1>SPTECH - Gráficos para dashboards</h1>
    <h2>Lucas Hideaki Tsuzuku - 1CCOA</h2>
    <section>
      <div class="grafico" id="div_grafico1">
        <canvas id="can_grafico1"></canvas>
      </div>
      <div class="grafico" id="div_grafico2">
        <canvas id="can_grafico1"></canvas>
      </div>
    </section>
  </body>
  <script>
    const grafico1 = document.getElementById("can_grafico1");
    new Chart(grafico1, {
      type: "line",
      data: {
        labels: ["12:00", "13:00", "14:00", "15:00", "16:00", "17:00"],
        datasets: [
          {
            label: "Temperatura (°C)",
            data: [30, 29, 28, 25, 22, 23],
            borderWidth: 2,
            backgroundColor: "#283618",
            borderColor: "#606c38",
          },
          {
            label: "Umidade (%)",
            data: [80, 82, 80, 85, 80, 83],
            borderWidth: 2,
            backgroundColor: "#219ebc",
            borderColor: "#023047",
          },
        ],
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
          },
        },
      },
    });
  </script>
</html>
